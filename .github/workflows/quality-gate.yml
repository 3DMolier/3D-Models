# Преграда качества: проверки, которые обязаны пройти до публикации.
#
# ЧЕСТНОЕ ОГРАНИЧЕНИЕ. GitHub Pages публикует ветку сам, сразу после push -
# сборка ничего не «пропускает» и не «задерживает». Поэтому эта проверка не
# останавливает выкладку, а показывает красный крест и присылает письмо, если
# в выложенном есть то, что мы уже однажды ловили руками. Настоящей преградой
# она станет, если переключить Pages на публикацию через Actions; сейчас так не
# сделано намеренно: рабочее дерево 3 ГБ, и загрузка его целиком при каждой
# правке ненадёжна (срыв публикации был на 3,33 ГБ).
#
# ЧТО ПРОВЕРЯЕМ И ПОЧЕМУ ИМЕННО ЭТО. Каждая проверка стоит здесь потому, что
# соответствующая поломка уже случалась на живом сайте:
#   * разбор JS      - минифицированный файл с ошибкой ронял каталог целиком;
#   * audit-site     - общий предвыкладочный аудит страниц;
#   * внутренние ссылки - адрес карточки, вычисленный из названия, дал 404;
#   * разметка       - ссылка на узел #org, которого в графе нет;
#   * брак в тексте  - двойное экранирование в мета-тегах, обрыв описания.
#
# Чего здесь нет. check-css-classes сверяет живую страницу с заново собранной,
# а для сборки нужны data/records - они в репозиторий не идут (277 МБ). Эта
# проверка остаётся местной, её запускают перед большой пересборкой.

name: Quality gate

on:
  push:
    branches: [main]
  workflow_dispatch:

# Правка догоняет правку: если пришёл новый push, старую проверку добиваем -
# её ответ уже неинтересен, а очередь она занимает надолго.
concurrency:
  group: quality-gate
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Глубина 1: история сайта - это 54 тысячи страниц за много месяцев,
      # полная выгрузка заняла бы больше, чем сами проверки.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Разбор исходных JS
        run: |
          ERRORS=0
          for f in assets/js/*.js; do
            case "$f" in *.min.js) continue;; esac
            node --check "$f" || { echo "ОШИБКА РАЗБОРА: $f"; ERRORS=$((ERRORS+1)); }
          done
          [ $ERRORS -eq 0 ] || exit 1

      - name: Предвыкладочный аудит страниц
        run: node scripts/audit-site.mjs

      - name: Внутренние ссылки
        run: node scripts/check-internal-links.mjs

      - name: Разметка для поисковых систем
        run: node scripts/check-schema.mjs

      - name: Брак в тексте карточек
        run: node scripts/check-content-defects.mjs
