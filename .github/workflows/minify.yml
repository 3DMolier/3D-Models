name: Minify CSS and JS

on:
  push:
    paths:
      - 'assets/css/*.css'
      - 'assets/js/*.js'
  workflow_dispatch:

jobs:
  minify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tools
        run: npm install -g clean-css-cli terser

      - name: Validate JS syntax
        run: |
          ERRORS=0
          for f in assets/js/*.js; do
            case "$f" in *.min.js) continue;; esac
            node --check "$f" && echo "OK: $f" || { echo "SYNTAX ERROR: $f"; ERRORS=$((ERRORS+1)); }
          done
          [ $ERRORS -eq 0 ] || exit 1

      # Списки файлов были записаны здесь поимённо, и это дважды сломало сборку.
      # Сначала cleancss обрывался на удалённом catalog.css. Потом git add падал
      # на несуществующем catalog.min.css - а «2>/dev/null || true» это скрывал,
      # поэтому в индекс не попадало НИЧЕГО и шаг рапортовал «Nothing to commit».
      # Минифицированные файлы отставали от исходников на неделю, и прод грузил
      # старый код: на странице каталога не работала догрузка чанков.
      # Теперь имена не перечисляем - берём всё, что лежит в папках.
      - name: Minify CSS
        run: |
          for f in assets/css/*.css; do
            case "$f" in *.min.css) continue;; esac
            out="${f%.css}.min.css"
            cleancss -o "$out" "$f"
            echo "$out: $(wc -c < "$out") bytes"
          done

      - name: Minify JS
        run: |
          for f in assets/js/*.js; do
            case "$f" in *.min.js) continue;; esac
            terser "$f" -o "${f%.js}.min.js" --compress --mangle
            echo "Minified $f"
          done

      - name: Commit minified files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in assets/css/*.min.css assets/js/*.min.js; do
            [ -f "$f" ] && git add -f "$f"
          done
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: auto-minify CSS and JS [skip ci]"
            git push origin HEAD
          fi
